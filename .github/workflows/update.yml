name: Update DND deck

# One cron set, no gate.
#
# GitHub's scheduled triggers are best-effort and on free runners routinely
# land 1.5-3 hours late. An earlier version listed both DST offsets and had the
# job check the wall-clock ET hour to decide which set owned the slot -- which
# turned every delayed run into a skipped one. Over the first three days that
# cancelled 15 of 16 scheduled runs, each reporting success while doing nothing.
#
# So: a single set of times, chosen to land after the morning news drop in both
# halves of the year, and nothing that can decline to run.
#
#   14:23 UTC -> 10:23 EDT / 09:23 EST
#   17:23 UTC -> 13:23 EDT / 12:23 EST
#   21:23 UTC -> 17:23 EDT / 16:23 EST
#
# Most News files at 12:00 UTC (08:00 ET), so the morning run clears it either
# way. Minute :23 rather than :00 because the top of the hour is when GitHub's
# queue is deepest.
on:
  schedule:
    - cron: "23 14,17,21 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many slides to refresh (max 18)"
        required: false
        default: "18"
      dry_run:
        description: "Plan only, leave the deck alone"
        type: boolean
        required: false
        default: false

concurrency:
  group: dnd-deck
  cancel-in-progress: false

permissions:
  contents: write        # force-pushes the per-article QR codes to the qr branch

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --omit=dev

      - name: How late did this trigger land?
        if: github.event_name == 'schedule'
        run: |
          echo "scheduled: ${{ github.event.schedule }}"
          echo "now:       $(TZ=America/New_York date '+%a %H:%M %Z')"

      - name: Refresh slides 2-19
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/update.mjs \
            --limit "${{ github.event.inputs.limit || '18' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
